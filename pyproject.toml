[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "naavik"
version = "0.5.0"
authors = [
  { name="Abhishek Bisht", email="abhishekbisht1429@gmail.com" },
]
description = "A framework for model training"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "omegaconf>=2.3.0",
    "torch==2.13.0",
    "pyyaml",
    "OmegaConf",
    "pytest",
    "tensorboard>=2.20.0",
    # The launcher (naavik.launcher) evaluates pinned requirements and
    # requires-python with it. 22.0 removed the legacy (non-PEP 440)
    # versions and specifiers the strict checks rely on.
    "packaging>=22.0",
]

[project.scripts]
# One command for launching experiments and reading their results;
# `navik` is the same command under its other common spelling.
naavik = "naavik.cli:main"
navik = "naavik.cli:main"

[project.optional-dependencies]
# Image datasets (naavik.components.builtin.datasets); scipy
# reads the Flowers102 and Stanford Cars annotations.
vision = [
    "torchvision==0.28.0",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]